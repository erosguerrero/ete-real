name: Deploy Quartz to Hostinger

on:
  push:
    branches:
      - v4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 🏗️
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build Quartz 🚀
        run: npx quartz build

      - name: Deploy via FTP 📤
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          # PROBABLEMENTE ESTO SEA LO CORRECTO AHORA:
          server-dir: ./
          # Añadimos esto para mayor estabilidad con Hostinger:
          protocol: ftp
          port: 21