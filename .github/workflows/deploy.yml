name: Deploy Quartz to Hostinger

on:
  push:
    branches:
      - v4 # Asegúrate de que este sea el nombre de tu rama principal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Crucial para que Quartz lea las fechas de edición de los archivos

      - name: Setup Node 🏗️
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build Quartz 🚀
        run: npx quartz build

      - name: Deploy via FTP 📤
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          # IMPORTANTE: Ajusta esta ruta a la que veas en tu FTP de Hostinger
          server-dir: domains/etereal.erosguerrero.es/public_html/
          state-name: .ftp-deploy-sync-state.json